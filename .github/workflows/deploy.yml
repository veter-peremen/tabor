name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env file
        run: |
          cat > .env << EOF
          BOT_TOKEN=${{ secrets.ENV_BOT_TOKEN }}
          SUPERADMIN_IDS=${{ secrets.ENV_SUPERADMIN_IDS }}
          DB_PATH=${{ secrets.ENV_DB_PATH }}
          PROXY=${{ secrets.ENV_PROXY }}
          EOF

      - name: Copy .env to server
        run: |
          scp -P ${{ secrets.SSH_PORT || 22 }} .env \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/.env

      - name: Push to remote server
        run: |
          git remote add deploy ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}
          git push deploy HEAD:main --force
