name: Deploy On Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # === Создаём .env  ===
      - name: Create .env
        run: |
          cat > .env << EOF
          # сюда все твои переменные из секретов
          APP_ENV=production
          # ...
          EOF

      - name: Copy .env to server
        run: |
          scp -P ${{ secrets.SSH_PORT || 22 }} .env \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/bots/tabor/.env

      # === Основной деплой  ===
      - name: Deploy on server
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            LOGFILE=~/logs/deploy-logs
            mkdir -p ~/logs
            exec > >(tee -a $LOGFILE) 2>&1

            echo "$(date): Starting deploy from GitHub Actions"

            WORKDIR=/root/bots/tabor/
            cd "$WORKDIR" || { echo "Can'\''t open directory $WORKDIR"; exit 1; }

            # Аналог checkout + merge
            git fetch origin
            git checkout deploy
            git merge --ff-only origin/main || git merge origin/main

            echo "Merged main"

            "$WORKDIR"/venv/bin/pip install -r "$WORKDIR"/requirements.txt
            echo "Dependencies installed"

            systemctl restart tabor-bot.service
            echo "Restart service"
            echo "$(date): Deploy finished successfully"
          '
